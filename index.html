  <style>
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f5f9ff;
      transition: opacity .5s ease, visibility .5s
    }

    #preloader.done {
      opacity: 0;
      visibility: hidden
    }

    #preloader .pl-mark {
      font: 800 2rem system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #0b1a44;
      letter-spacing: -.02em
    }

    #preloader .pl-mark span {
      color: #2563eb
    }

    #preloader .pl-bar {
      width: 140px;
      height: 4px;
      border-radius: 4px;
      background: #dbeafe;
      overflow: hidden
    }

    #preloader .pl-bar i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 4px;
      background: linear-gradient(90deg, #3b82f6, #38bdf8);
      animation: pl 1s ease-in-out infinite
    }

    @keyframes pl {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(350%)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      #preloader .pl-bar i {
        animation: none;
        width: 100%
      }
    }
  </style>
  <noscript>
