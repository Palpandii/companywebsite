<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | LenoTech</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5f9ff;
            color: #2a3a5f;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', 'Noto Sans Tamil', sans-serif;
            text-align: center
        }

        .card {
            max-width: 480px;
            padding: 40px 32px;
            background: #fff;
            border: 1px solid #e2eafb;
            border-radius: 24px;
            box-shadow: 0 14px 34px rgba(37, 99, 235, .1)
        }

        .code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(100deg, #1d4ed8, #2563eb 45%, #0ea5e9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        h1 {
            margin: 12px 0 8px;
            font-size: 1.5rem;
            color: #0b1a44
        }

        p {
            margin: 0 0 6px;
            line-height: 1.6;
            color: #62739a
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px
        }

        a.btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: transform .25s
        }

        a.btn:hover {
            transform: translateY(-2px)
        }

        .primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            box-shadow: 0 8px 22px rgba(37, 99, 235, .32)
        }

        .ghost {
            border: 1px solid #c9d9f7;
            color: #1d4ed8;
            background: #fff
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="code">404</div>
        <h1>This page does not exist</h1>
        <p>The link may be old or mistyped.</p>
        <p lang="ta">இந்தப் பக்கம் இல்லை. இணைப்பு பழையதாக இருக்கலாம்.</p>
        <div class="actions">
            <a class="btn primary" href="/">Back to LenoTech</a>
            <a class="btn ghost" href="/#contact">Contact</a>
        </div>
    </main>
</body>

</html>
